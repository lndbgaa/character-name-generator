<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Password Reset 🔐</title>

    <style>
      @media only screen and (max-width: 600px) {
        .container {
          width: 100% !important;
          padding: 20px !important;
        }
        h2 {
          font-size: 24px !important;
        }
        p,
        a {
          font-size: 18px !important;
        }
      }
    </style>
  </head>

  <body style="margin: 0; padding: 0; background-color: #f9f9f9; font-family: Arial, sans-serif">
    <table
      width="100%"
      cellpadding="0"
      cellspacing="0"
      border="0"
      style="background-color: #f9f9f9; padding: 20px"
    >
      <tr>
        <td align="center">
          <table
            class="container"
            width="600"
            cellpadding="0"
            cellspacing="0"
            border="0"
            style="background: #ffffff; border-radius: 8px; padding: 40px"
          >
            <tr>
              <td align="center" style="padding-bottom: 20px">
                <h2 style="color: #073b3a; font-size: 28px; margin: 0">Password Reset 🔐</h2>
              </td>
            </tr>

            <tr>
              <td style="font-size: 18px; color: #555555; text-align: center; padding-bottom: 20px">
                Hi <strong style="color: #073b3a"><%= firstName %></strong> 👋,
              </td>
            </tr>

            <tr>
              <td style="font-size: 16px; color: #555555; text-align: center; padding-bottom: 20px">
                You requested to reset your password.<br /><br />
                Click the button below to set a new password:
              </td>
            </tr>

            <tr>
              <td align="center" style="padding-bottom: 30px">
                <table role="presentation" border="0" cellpadding="0" cellspacing="0">
                  <tr>
                    <td align="center" bgcolor="#45A861" style="border-radius: 8px">
                      <a
                        href="<%= resetLink %>"
                        target="_blank"
                        style="
                          display: inline-block;
                          padding: 12px 24px;
                          font-family: Arial, sans-serif;
                          font-size: 16px;
                          color: #ffffff;
                          text-decoration: none;
                        "
                      >
                        🔐 Reset My Password
                      </a>
                    </td>
                  </tr>
                </table>
              </td>
            </tr>

            <tr>
              <td
                style="
                  font-size: 14px;
                  color: #555555;
                  text-align: center;
                  padding-bottom: 20px;
                  line-height: 1.5;
                "
              >
                This link is valid for <strong>1 hour</strong>.<br />
                If you did not request this, simply ignore this email.
              </td>
            </tr>

            <tr>
              <td
                style="
                  font-size: 14px;
                  color: #5c7a71;
                  text-align: center;
                  padding-top: 30px;
                  line-height: 1.5;
                "
              >
                Thank you for trusting EcoRide 💚<br />
              </td>
            </tr>

            <tr>
              <td style="font-size: 12px; color: #c4c4c4; text-align: center; padding-top: 20px">
                The EcoRide Team 🌱
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
